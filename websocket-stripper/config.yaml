name: WebSocket Stripper
version: "0.2.4"
slug: websocket_stripper
stage: stable
description: Serves your real HA dashboards but trims the entity websocket to only what each dashboard uses — fast kiosk loads, full fidelity.
url: https://github.com/GabrielGoldsteinAnidea/HA-Websocket-Stripper
arch:
  - amd64
  - aarch64
  - armv7
init: false
# host_network: lets the add-on see the REAL browser IP (not the Docker gateway
# 172.30.32.1), so HA's trusted_networks auth provider can match the kiosk's LAN IP
# via X-Forwarded-For. With a mapped port the client IP is rewritten by Docker before
# the proxy sees it, breaking trusted login. Trade-off: the add-on binds :8099 directly
# on the host, and the internal `homeassistant`/`supervisor` DNS names may not resolve —
# use the ha_base / allow_ws_url options below to pin them to IPs if startup fails.
host_network: true
# SUPERVISOR_TOKEN + core API access (used only to precompute the dashboard allowlists).
homeassistant_api: true
hassio_api: true
# No `ports:` mapping: with host_network the add-on binds the host port directly, so a
# Docker port map is inert. The single source of truth for the listen port is the `port`
# option below (default 8099). Reach the add-on at http://<host>:<port>.
options:
  # Empty on purpose. This used to default to the author's own dashboards, which on anyone
  # else's instance resolve to nothing — and an empty allowlist is not a harmless no-op: HA
  # reads `set(msg["entity_ids"]) or None`, so an empty entity_ids means NO filter, and the
  # add-on would relay the full firehose it exists to prevent. Set this to your own
  # dashboards' url_path values (Settings -> Dashboards).
  dashboards: []
  always_forward: []
  never_forward: []
  strip_entities: true
  # Also trim the entity/device/area registries to what the connection can see. This is the
  # larger payload on a big instance once states are trimmed. Turn OFF first if names, areas
  # or device links render oddly.
  trim_registries: true
  # HA's own websocket negotiates permessage-deflate; the `ws` library does not do so
  # server-side by default, so putting this add-on in front of HA silently removes compression
  # from the browser leg. On by default to restore it. Turn off only on very weak hardware
  # where deflate CPU costs more than the bytes it saves.
  # Memory: each compressed connection keeps a ~300 KB zlib window (context takeover, the
  # default). Fine for a few kiosks; budget for it on a large fleet.
  compress_websocket: true
  # Trim Lovelace resources (custom cards) per dashboard. Resources are instance-wide in HA,
  # so every kiosk parses EVERY custom card you have installed — 21MB of JavaScript for a
  # 4-card wall panel on the instance this was built against. Off by default.
  #
  # Most mistakes here are loud and easy to find: a missing card renders as "Custom element
  # doesn't exist", a missing icon pack shows blank icons, a missing frontend patcher brings
  # the HA header and sidebar back. Turn it on, watch one load, add whatever broke to
  # resources_always_forward.
  #
  # The exception — and the only reason this is off by default — is a resource that registers
  # no element and renders nothing but runs on load: an idle timer, a pop-up, a heartbeat.
  # Dropping one of those is INVISIBLE; the dashboard is pixel-identical and only the
  # behaviour stops. Read the "dropped by ALL dashboards" block in the log, which is where
  # such a resource would appear.
  trim_resources: false
  # URL patterns (literal substring or /regex/) always sent, whatever the content match says.
  # Needed for global plugins that patch the frontend rather than registering a card — they
  # contain none of the dashboard's card names, so the match cannot see that they are used.
  resources_always_forward: []
  # URL patterns never sent to any dashboard. Wins over always.
  resources_never_forward: []
  port: 8099
  ha_base: ""
  allow_ws_url: ""
schema:
  dashboards:
    - str
  always_forward:
    - str
  never_forward:
    - str
  strip_entities: bool
  trim_registries: bool
  compress_websocket: bool
  trim_resources: bool
  resources_always_forward:
    - str
  resources_never_forward:
    - str
  port: "int(1,65535)?"
  ha_base: "str?"
  allow_ws_url: "str?"
