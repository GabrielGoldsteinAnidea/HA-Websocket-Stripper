name: WebSocket Stripper
version: "0.3.0"
slug: websocket_stripper
stage: stable
description: Serves your real HA dashboards but trims the entity websocket to only what each dashboard uses — fast kiosk loads, full fidelity.
url: https://github.com/GabrielGoldsteinAnidea/HA-Websocket-Stripper
arch:
  - amd64
  - aarch64
  - armv7
init: false
# host_network: lets the add-on see the REAL browser IP (not the Docker gateway
# 172.30.32.1), so HA's trusted_networks auth provider can match the kiosk's LAN IP
# via X-Forwarded-For. With a mapped port the client IP is rewritten by Docker before
# the proxy sees it, breaking trusted login. Trade-off: the add-on binds :8099 directly
# on the host, and the internal `homeassistant`/`supervisor` DNS names may not resolve —
# use the ha_base / allow_ws_url options below to pin them to IPs if startup fails.
host_network: true
# SUPERVISOR_TOKEN + core API access (used only to precompute the dashboard allowlists).
homeassistant_api: true
hassio_api: true
# No `ports:` mapping: with host_network the add-on binds the host port directly, so a
# Docker port map is inert. The single source of truth for the listen port is the `port`
# option below (default 8099). Reach the add-on at http://<host>:<port>.
options:
  # Empty on purpose. This used to default to the author's own dashboards, which on anyone
  # else's instance resolve to nothing — and an empty allowlist is not a harmless no-op: HA
  # reads `set(msg["entity_ids"]) or None`, so an empty entity_ids means NO filter, and the
  # add-on would relay the full firehose it exists to prevent. Set this to your own
  # dashboards' url_path values (Settings -> Dashboards).
  dashboards: []
  always_forward: []
  never_forward: []
  strip_entities: true
  # PER-CONNECTION SCOPING. Off by default, so an existing install behaves exactly as before.
  #
  # With `dashboards` holding more than one kiosk, the allowlist is their UNION and every
  # connection gets all of it -- so adding a dashboard grows what every OTHER kiosk receives.
  # On a 50-dashboard fleet that is a panel holding 535 entities where its own dashboard needs
  # 148. Turn this on and each connection gets only the dashboards mapped to the HA user it
  # authenticated as; anything unrecognised falls back to the union, i.e. to today's behaviour.
  #
  # It only helps if each kiosk signs in as its OWN HA user. One shared user cannot be told
  # apart, and the websocket carries no other identity -- the dashboard is not in the request
  # path, because the ws is a separate connection from the page load.
  scope_per_connection: false
  # user: the HA user's ID (Settings -> People -> the user -> the id in the URL), not the name.
  #   The id survives a rename; a name does not, and a scope that stops matching fails SILENTLY
  #   back to the union.
  # dashboards: a subset of `dashboards` above. Entries here are not added to the allowlist --
  #   list them in `dashboards` too, or they resolve to nothing.
  scope_by_user: []
  port: 8099
  ha_base: ""
  allow_ws_url: ""
schema:
  dashboards:
    - str
  always_forward:
    - str
  never_forward:
    - str
  strip_entities: bool
  scope_per_connection: "bool?"
  scope_by_user:
    - user: str
      dashboards:
        - str
  port: "int(1,65535)?"
  ha_base: "str?"
  allow_ws_url: "str?"
